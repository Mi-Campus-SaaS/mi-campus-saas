name: CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-scan:
    name: Security Scan (Gitleaks + Yarn Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Use Yarn 1.x (classic)
        run: corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install Gitleaks
        run: |
          # Install Gitleaks from GitHub releases (open source version)
          set -e
          VER=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "Installing Gitleaks v$VER"
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks (Secret Scanning)
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        run: |
          # Run scan; do not fail step (we'll fail explicitly after parsing)
          gitleaks detect --config .gitleaks.toml --report-format json --report-path gitleaks-report.json --verbose || true
          # Ensure report file exists for artifact upload
          if [ ! -f gitleaks-report.json ]; then echo '[]' > gitleaks-report.json; fi

      - name: Evaluate Gitleaks Findings
        run: |
          # Determine report structure and count findings; avoid complex quoting in jq
          TYPE=$(jq -r 'type' gitleaks-report.json || echo "null")
          COUNT=0
          if [ "$TYPE" = "array" ]; then
            COUNT=$(jq 'length' gitleaks-report.json)
            if [ "$COUNT" -gt 0 ]; then
              echo "## 🚨 Secrets Found!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "The following secrets were detected (showing up to 10):" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              jq -r '.[0:10][] | "- " + ((.RuleID // .rule_id // "rule")|tostring) + " in " + ((.File // .file // "unknown")|tostring)' gitleaks-report.json >> $GITHUB_STEP_SUMMARY || true
              exit 1
            fi
          else
            COUNT=$(jq '(.findings // .leaks // []) | length' gitleaks-report.json 2>/dev/null || echo 0)
            if [ "$COUNT" -gt 0 ]; then
              echo "## 🚨 Secrets Found!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "The following secrets were detected (showing up to 10):" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              jq -r '(.findings // .leaks)[0:10][] | "- " + ((.RuleID // .rule_id // "rule")|tostring) + " in " + ((.File // .file // "unknown")|tostring)' gitleaks-report.json >> $GITHUB_STEP_SUMMARY || true
              exit 1
            fi
          fi
          echo "## ✅ No Secrets Found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The secret scan completed successfully with no issues detected." >> $GITHUB_STEP_SUMMARY
      - name: Run Yarn Audit (Dependency Scanning)
        run: |
          yarn audit --level high --json > yarn-audit-report.json || true
          # Ensure report file exists and is valid JSON
          if [ ! -f yarn-audit-report.json ] || [ ! -s yarn-audit-report.json ]; then
            echo '{"advisories":{}}' > yarn-audit-report.json
          fi
      - name: Check for High/Critical Vulnerabilities
        run: |
          if [ -s yarn-audit-report.json ]; then
            echo "Checking for high/critical vulnerabilities..."
            # Check if the JSON is valid and has advisories
            if jq -e '.advisories' yarn-audit-report.json > /dev/null 2>&1; then
              HIGH_CRITICAL=$(jq -r '.advisories | to_entries[] | select(.value.severity == "high" or .value.severity == "critical") | .key' yarn-audit-report.json | sort -u)
              if [ -n "$HIGH_CRITICAL" ]; then
                echo "Found high/critical vulnerabilities:"
                echo "$HIGH_CRITICAL"
                echo "Please review yarn-audit-exemptions.json for allowed exemptions"
                exit 1
              fi
            else
              echo "No advisories found in audit report"
            fi
          else
            echo "No audit report generated"
          fi
        shell: bash

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gitleaks-report.json
            yarn-audit-report.json

  lint:
    name: Lint (FE + BE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Use Yarn 1.x (classic)
        run: corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run lint
        run: yarn lint

  test-backend:
    name: Test Backend (Jest)
    runs-on: ubuntu-latest
    needs: [security-scan, lint]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: micampus
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d micampus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Use Yarn 1.x (classic)
        run: corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run backend unit tests
        env:
          NODE_ENV: test
          DB_TYPE: postgres
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: micampus
        run: yarn --cwd apps/backend test --ci --runInBand

  typecheck-frontend:
    name: Typecheck Frontend (TS)
    runs-on: ubuntu-latest
    needs: [security-scan, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Use Yarn 1.x (classic)
        run: corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Type check
        run: yarn --cwd apps/frontend run tsc -b --pretty false

  e2e:
    name: Playwright Tests (E2E + Visual)
    runs-on: ubuntu-latest
    needs: [security-scan, lint, test-backend, typecheck-frontend]
    timeout-minutes: 30
    env:
      # Backend configuration
      PORT: 8080
      JWT_SECRET: your-super-secret-jwt-key-at-least-32-characters-long-for-testing
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-at-least-32-characters-long-for-testing
      DATABASE_PATH: ./data/dev.sqlite
      UPLOAD_DIR: uploads
      OTEL_ENABLED: false
      CORS_ALLOWLIST: http://localhost:5173,http://localhost:8080
      # Frontend configuration
      VITE_API_URL: http://localhost:8080/api
      VITE_OTEL_ENDPOINT: http://localhost:4318/v1/traces
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Use Yarn 1.x (classic)
        run: corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Seed database
        run: yarn --cwd apps/backend seed:dev
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Start backend server
        run: |
          cd apps/backend
          yarn start:dev &
          sleep 10
          curl -f http://localhost:8080/api/health || exit 1
      - name: Start frontend server
        run: |
          cd apps/frontend
          yarn dev &
          sleep 10
          curl -f http://localhost:5173 || exit 1
      - name: Run functional Playwright tests
        run: yarn test:e2e tests/e2e/happy-path.spec.ts
      - name: Run visual regression tests
        run: yarn test:visual
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results
          if-no-files-found: ignore

  budgets:
    name: Budgets (Bundle + Perf)
    runs-on: ubuntu-latest
    needs: [security-scan, lint, typecheck-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Use Yarn 1.x (classic)
        run: corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run bundle budgets
        run: yarn budgets:bundle
      - name: Run performance budgets
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'false'
          CHROME_PATH: $(node -e "console.log(require('puppeteer').executablePath())")
        run: yarn budgets:perf


