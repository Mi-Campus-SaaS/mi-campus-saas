name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-scan:
    name: Security Scan (Gitleaks + Yarn Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Use Yarn 1.x (classic)
        run: |
          # Retry corepack prepare with exponential backoff
          for i in {1..5}; do
            if corepack prepare yarn@1.22.22 --activate; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in $((i * 2)) seconds..."
            sleep $((i * 2))
          done
          # Fallback: install yarn via npm if corepack fails
          echo "Corepack failed, installing yarn via npm as fallback"
          npm install -g yarn@1.22.22
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Security Scan Placeholder
        run: |
          echo "## 🔒 Security Scanning" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Secret scanning will be implemented in the future." >> $GITHUB_STEP_SUMMARY
          echo "Currently running dependency vulnerability scan only." >> $GITHUB_STEP_SUMMARY
      - name: Run Yarn Audit (Dependency Scanning)
        run: |
          yarn audit --level high --json > yarn-audit-report.json || true
          # Ensure report file exists and is valid JSON
          if [ ! -f yarn-audit-report.json ] || [ ! -s yarn-audit-report.json ]; then
            echo '{"advisories":{}}' > yarn-audit-report.json
          fi
      - name: Check for High/Critical Vulnerabilities
        run: |
          if [ -s yarn-audit-report.json ]; then
            echo "Checking for high/critical vulnerabilities..."
            # Check if the JSON is valid and has advisories
            if jq -e '.advisories' yarn-audit-report.json > /dev/null 2>&1; then
              HIGH_CRITICAL=$(jq -r '.advisories | to_entries[] | select(.value.severity == "high" or .value.severity == "critical") | .key' yarn-audit-report.json | sort -u)
              if [ -n "$HIGH_CRITICAL" ]; then
                echo "Found high/critical vulnerabilities:"
                echo "$HIGH_CRITICAL"
                echo "Please review yarn-audit-exemptions.json for allowed exemptions"
                exit 1
              fi
            else
              echo "No advisories found in audit report"
            fi
          else
            echo "No audit report generated"
          fi
        shell: bash

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            yarn-audit-report.json

  lint:
    name: Lint (FE + BE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Use Yarn 1.x (classic)
        run: |
          # Retry corepack prepare with exponential backoff
          for i in {1..5}; do
            if corepack prepare yarn@1.22.22 --activate; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in $((i * 2)) seconds..."
            sleep $((i * 2))
          done
          # Fallback: install yarn via npm if corepack fails
          echo "Corepack failed, installing yarn via npm as fallback"
          npm install -g yarn@1.22.22
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run lint
        run: yarn lint

  test-backend:
    name: Test Backend (Jest)
    runs-on: ubuntu-latest
    needs: [security-scan, lint]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: micampus
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d micampus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Use Yarn 1.x (classic)
        run: |
          # Retry corepack prepare with exponential backoff
          for i in {1..5}; do
            if corepack prepare yarn@1.22.22 --activate; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in $((i * 2)) seconds..."
            sleep $((i * 2))
          done
          # Fallback: install yarn via npm if corepack fails
          echo "Corepack failed, installing yarn via npm as fallback"
          npm install -g yarn@1.22.22
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run backend unit tests
        env:
          NODE_ENV: test
          DB_TYPE: postgres
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: micampus
        run: yarn --cwd apps/backend test --ci --runInBand

  typecheck-frontend:
    name: Typecheck Frontend (TS)
    runs-on: ubuntu-latest
    needs: [security-scan, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Use Yarn 1.x (classic)
        run: |
          # Retry corepack prepare with exponential backoff
          for i in {1..5}; do
            if corepack prepare yarn@1.22.22 --activate; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in $((i * 2)) seconds..."
            sleep $((i * 2))
          done
          # Fallback: install yarn via npm if corepack fails
          echo "Corepack failed, installing yarn via npm as fallback"
          npm install -g yarn@1.22.22
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Type check
        run: yarn --cwd apps/frontend run tsc -b --pretty false

  e2e:
    name: Playwright Tests (E2E + Visual)
    runs-on: ubuntu-latest
    needs: [security-scan, lint, test-backend, typecheck-frontend]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: micampus
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d micampus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Backend configuration
      PORT: 8080
      JWT_SECRET: your-super-secret-jwt-key-at-least-32-characters-long-for-testing
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-at-least-32-characters-long-for-testing
      DB_TYPE: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: micampus
      UPLOAD_DIR: uploads
      OTEL_ENABLED: false
      CORS_ALLOWLIST: http://localhost:5173,http://localhost:8080
      CORS_ALLOW_SERVER_TO_SERVER: true
      # Frontend configuration
      VITE_API_URL: http://localhost:8080/api
      VITE_OTEL_ENDPOINT: http://localhost:4318/v1/traces
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Use Yarn 1.x (classic)
        run: |
          # Retry corepack prepare with exponential backoff
          for i in {1..5}; do
            if corepack prepare yarn@1.22.22 --activate; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in $((i * 2)) seconds..."
            sleep $((i * 2))
          done
          # Fallback: install yarn via npm if corepack fails
          echo "Corepack failed, installing yarn via npm as fallback"
          npm install -g yarn@1.22.22
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run database migrations
        run: yarn --cwd apps/backend migration:run
      - name: Seed database
        run: yarn --cwd apps/backend seed:dev
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Create uploads directory
        run: mkdir -p uploads
      - name: Install curl (if needed)
        run: |
          if ! command -v curl &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y curl
          fi
      - name: Start backend server
        env:
          NODE_ENV: test
        run: |
          cd apps/backend
          yarn start:dev > server.log 2>&1 &
          SERVER_PID=$!
          echo "Started backend server (PID: $SERVER_PID)"
          # Wait for server to be ready with retries
          for i in {1..60}; do
            # Check if process is still alive
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "❌ Server process died"
              echo "Server logs:"
              cat server.log
              exit 1
            fi
            # Check if port is listening
            if command -v netstat &> /dev/null; then
              PORT_LISTENING=$(netstat -tln 2>/dev/null | grep -c ":8080 " || echo "0")
            elif command -v ss &> /dev/null; then
              PORT_LISTENING=$(ss -tln 2>/dev/null | grep -c ":8080 " || echo "0")
            else
              PORT_LISTENING="unknown"
            fi
            # Try health check
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/healthz || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Server is ready and responding (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Waiting for server... ($i/60) [HTTP: $HTTP_CODE, Port listening: $PORT_LISTENING]"
            sleep 1
          done
          echo "❌ Server failed to start after 60 seconds"
          echo "Server logs:"
          tail -100 server.log
          echo "Testing connection:"
          curl -v http://localhost:8080/api/healthz || true
          exit 1
      - name: Start frontend server
        run: |
          cd apps/frontend
          yarn dev &
          sleep 10
          curl -f http://localhost:5173 || exit 1
      - name: Run functional Playwright tests
        run: yarn test:e2e tests/e2e/happy-path.spec.ts
      - name: Run visual regression tests
        run: yarn test:visual
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Upload visual baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/visual.spec.ts-snapshots
          if-no-files-found: ignore
      - name: Upload screenshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results
          if-no-files-found: ignore

  budgets:
    name: Budgets (Bundle + Perf)
    runs-on: ubuntu-latest
    needs: [security-scan, lint, typecheck-frontend]
    env:
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Use Yarn 1.x (classic)
        run: |
          # Retry corepack prepare with exponential backoff
          for i in {1..5}; do
            if corepack prepare yarn@1.22.22 --activate; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in $((i * 2)) seconds..."
            sleep $((i * 2))
          done
          # Fallback: install yarn via npm if corepack fails
          echo "Corepack failed, installing yarn via npm as fallback"
          npm install -g yarn@1.22.22
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install @types/react for JSX runtime
        run: npm i --save-dev @types/react
        working-directory: apps/frontend
      - name: Install Chrome dependencies (for Lighthouse)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64
      - name: Run bundle budgets
        run: yarn budgets:bundle
      - name: Make Chrome launcher executable
        run: chmod +x tools/perf/chrome-launcher.js || true
      - name: Run performance budgets
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "false"
          CHROME_PATH: $(node -e "console.log(require('puppeteer').executablePath())")
          CHROME_FLAGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu --headless=new"
        run: yarn budgets:perf
