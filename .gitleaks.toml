title = "MI Campus Gitleaks Config"

[allowlist]
description = "Global allowlist for non-sensitive files and test patterns"
files = [
  'tests?/.*',
  '.*\.test\..*',
  '.*\.spec\..*',
  '.*\.e2e-spec\..*',
  'test-results/.*',
  'fixtures/.*',
  '.*\.md',
  '.*\.txt',
  'docs?/.*',
  'examples?/.*',
  '\\.env\\.example',
  '\\.env\\.template',
  'docker-compose\\.ya?ml',
  'node_modules/.*',
  'dist/.*',
  'build/.*',
  'coverage/.*',
  '\\.next/.*',
  '\\.nuxt/.*',
  'yarn\\.lock',
  'package-lock\\.json',
  'pnpm-lock\\.yaml',
  '\\.vscode/.*',
  '\\.idea/.*',
  '\\.cursor/.*',
  '\\.DS_Store',
  'Thumbs\\.db',
  '\\.git/.*',
  '\\.gitignore',
  '\\.gitattributes',
  '\\.github/workflows/.*'
]
regexes = [
  'JWT_SECRET.*your-super-secret.*',
  'JWT_REFRESH_SECRET.*your-super-secret.*',
  'postgres',
  'localhost',
  '127\\.0\\.0\\.1',
  'example\\.com',
  'test@example\\.com',
  'test.*password',
  'demo.*key',
  'sample.*token'
]

[[rules]]
id = "mi-campus-db-connection"
description = "MI Campus database connection strings"
regex = '''(?i)DATABASE_URL\s*=\s*postgres(ql)?://[^\s]+'''
tags = ["database", "postgresql", "mi-campus"]

[[rules]]
id = "mi-campus-api-keys"
description = "MI Campus generic API keys/tokens"
regex = '''(?i)(api[_-]?key|token|secret)\s*[:=]\s*['"]?[A-Za-z0-9-_]{20,}['"]?'''
tags = ["api", "key", "token", "mi-campus"]
