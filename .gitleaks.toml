title = "MI Campus Gitleaks Config"

[[allowlist]]
description = "Global allowlist for non-sensitive files and test patterns"
files = [
  'tests?/.*',
  '.*\.test\..*',
  '.*\.spec\..*',
  '.*\.e2e-spec\..*',
  'test-results/.*',
  'fixtures/.*',
  '.*\.md',
  '.*\.txt',
  'docs?/.*',
  'examples?/.*',
  '.*jest\.setup\.js$',
  '.*\.env\.example$',
  '.*\.env\.template$',
  'docker-compose\.ya?ml$',
  'node_modules/.*',
  'dist/.*',
  'build/.*',
  'coverage/.*',
  '.*\.next/.*',
  '.*\.nuxt/.*',
  'yarn\.lock$',
  'package-lock\.json$',
  'pnpm-lock\.yaml$',
  '.*\.vscode/.*',
  '.*\.idea/.*',
  '.*\.cursor/.*',
  '.*\.DS_Store$',
  'Thumbs\.db$',
  '.*\.git/.*',
  '.*\.gitignore$',
  '.*\.gitattributes$',
  '.*\.github/workflows/.*',
  'GITLEAKS_SETUP\.md',
  'SECURITY\.md',
  'README\.md',
  'apps/backend/jest\.setup\.js',
  'apps/backend/\.env\.example',
  'apps/backend/src/auth/auth\.controller\.spec\.ts'
]
regexes = [
  'JWT_SECRET.*your-super-secret.*',
  'JWT_REFRESH_SECRET.*your-super-secret.*',
  'test-jwt-secret-that-is-long-enough-for-validation-32-chars',
  'test-refresh-secret-that-is-long-enough-for-validation-32-chars',
  'dev_secret_change_me',
  'dev_refresh_secret_change_me',
  'postgres',
  'localhost',
  '127\.0\.0\.1',
  'example\.com',
  'test@example\.com',
  'test.*password',
  'demo.*key',
  'sample.*token'
]

[[rules]]
id = "mi-campus-db-connection"
description = "MI Campus database connection strings"
regex = '''(?i)DATABASE_URL\s*=\s*postgres(ql)?://[^\s]+'''
tags = ["database", "postgresql", "mi-campus"]

[[rules]]
id = "mi-campus-api-keys"
description = "MI Campus generic API keys/tokens"
regex = '''(?i)(api[_-]?key|token|secret)\s*[:=]\s*['"]?[A-Za-z0-9-_]{20,}['"]?'''
tags = ["api", "key", "token", "mi-campus"]
